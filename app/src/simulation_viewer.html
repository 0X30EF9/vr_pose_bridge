<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>URDF 闭环仿真回放</title><style>
*{box-sizing:border-box}body{margin:0;background:#09111c;color:#e0ebf7;font:15px system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #263447}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;color:#9db0c8}main{display:grid;grid-template-columns:minmax(400px,1fr) 340px;gap:16px;padding:16px}canvas{width:100%;height:70vh;min-height:400px;border:1px solid #263447;border-radius:12px;background:#0d1828}aside{padding:16px;background:#111e2e;border-radius:12px}button,select,input{font:inherit;accent-color:#36cfc9}button,select{background:#20344c;color:white;border:1px solid #3b536f;border-radius:6px;padding:7px;margin:4px}input[type=range]{width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;color:#b0c4db}.legend{display:flex;gap:18px;margin:10px 0}.good{color:#5de0ab}.bad{color:#ff818a}#metrics{line-height:1.9}.dot{border-radius:50%;display:inline-block;width:10px;height:10px;margin-right:5px}@media(max-width:850px){main{grid-template-columns:1fr}canvas{height:55vh}aside{order:2}}
</style><header><h1>URDF 双臂：独立物理闭环</h1><p>PyBullet 实测运动 · Pinocchio 双臂 IK · 固定基座 · 缺失网格使用简化球体</p></header>
<main><section><canvas id="view"></canvas><div><button id="play">暂停</button><select id="scene"></select><select id="speed"><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select><button id="reset">重置视角</button></div><input type="range" id="seek" min="0" value="0"><div class="legend"><span><i class="dot" style="background:#50c8ff"></i>URDF 实际骨架</span><span><i class="dot" style="background:#ffc861"></i>目标末端</span><span><i class="dot" style="background:#5de0ab"></i>实际末端</span></div><p>拖动旋转视角，滚轮缩放。此页面自包含，无需网络或 CDN。</p></section><aside><div id="status"></div><div id="metrics"></div><hr><p>简化几何不用于真实碰撞安全判断。电机增益为仿真设定，未辨识硬件。</p><details><summary>完整报告</summary><pre id="report"></pre></details></aside></main>
<script id="payload" type="application/json">__SIMULATION_DATA__</script><script>
const data=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let yaw=.8,pitch=.15,zoom=260,index=0,playing=true,drag=null,last=performance.now(),clock=0;
const names=[...new Set(data.frames.map(f=>f.scene))];$('scene').innerHTML=names.map(n=>`<option>${n}</option>`).join('');let subset=data.frames.filter(f=>f.scene===names[0]);
function choose(){subset=data.frames.filter(f=>f.scene===$('scene').value);index=0;clock=0;$('seek').max=subset.length-1;}choose();
$('scene').onchange=choose;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('seek').oninput=()=>{index=+$('seek').value;clock=subset[index].time};$('speed').onchange=()=>{};$('reset').onclick=()=>{yaw=.8;pitch=.15;zoom=260};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.007;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]}};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(70,Math.min(750,zoom*Math.exp(-e.deltaY*.001)))};
function project(p){const x=p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw),d=p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw),z=p[2]+.15;return [canvas.width/2+x*zoom,canvas.height/2-(z*Math.cos(pitch)-d*Math.sin(pitch))*zoom]}
function line(a,b,color,width=2){a=project(a);b=project(b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
function dot(p,color,r=4){p=project(p);ctx.fillStyle=color;ctx.beginPath();ctx.arc(...p,r,0,Math.PI*2);ctx.fill()}
function pose(t,color){const p=t.slice(0,3).map(r=>r[3]);dot(p,color,6);for(let k=0;k<3;k++){const end=p.map((v,j)=>v+.09*t[j][k]);line(p,end,['#ff6577','#73db99','#76b9ff'][k],2)}}
function render(){const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;if(canvas.width!==r.width*dpr||canvas.height!==r.height*dpr){canvas.width=r.width*dpr;canvas.height=r.height*dpr}ctx.clearRect(0,0,canvas.width,canvas.height);const f=subset[index];if(!f)return;
for(let i=-4;i<=4;i++){line([i*.25,-1,-1],[i*.25,1,-1],'#223247',1);line([-1,i*.25,-1],[1,i*.25,-1],'#223247',1)}
for(const [a,b] of data.edges)line(f.points[a],f.points[b],'#50c8ff',4);for(const p of f.points)dot(p,'#9fe5ff',3);f.target.forEach(t=>pose(t,'#ffc861'));f.actual.forEach(t=>pose(t,'#5de0ab'));
$('seek').value=index;const scene=data.report.scenarios.find(s=>s.name===f.scene);$('status').innerHTML=`<h2 class="${scene.passed?'good':'bad'}">${scene.passed?'PASS':'FAIL'} · ${f.scene}</h2><p>${f.time.toFixed(2)}s · ${index+1}/${subset.length} 帧</p><p class="${f.fault?'bad':'good'}">${f.status?escapeText(f.status):f.fault?'输入跟踪失效 · 不发送新命令':f.command_applied?'已提交仿真电机命令':'候选命令被拒绝'}</p>`;
$('metrics').innerHTML=`功能/安全 ${scene.accuracy_safety_passed?'PASS':'FAIL'}<br>控制计算 ${scene.control_compute_passed?'PASS':'FAIL'}<br>完整仿真预算 ${scene.simulation_budget_passed?'PASS':'FAIL'}<br>末端位置误差 ${(f.position_error_m*1000).toFixed(1)} mm<br>姿态误差 ${(f.orientation_error_rad*180/Math.PI).toFixed(1)}°<br>控制 ${data.report.control_hz} Hz · 物理 ${data.report.physics_hz} Hz<br>IK p99 ${scene.timing.solver_ms.p99.toFixed(2)} ms<br>控制计算 p99 ${scene.timing.control_compute_ms.p99.toFixed(2)} ms<br>物理子步 p99 ${scene.timing.physics_ms.p99.toFixed(2)} ms<br>独立验证 p99 ${scene.timing.validation_observer_ms.p99.toFixed(2)} ms<br>完整仿真 p99 ${scene.timing.pipeline_ms.p99.toFixed(2)} ms<br>整步超预算 ${scene.compute_budget_misses} 帧<br>实际周期超时 ${scene.wall_period_overruns??'未启用定时'}<br>硬限位违规 ${scene.hard_limit_violation_frames}<br>速度违规 ${scene.velocity_violation_frames}`;}
$('report').textContent=JSON.stringify(data.report,null,2);
function animate(now){if(playing){clock+=(now-last)/1000*+$('speed').value;if(clock>subset[subset.length-1].time)clock=0;index=Math.min(subset.length-1,Math.floor(clock*(data.report.viewer_hz||data.report.control_hz)))}last=now;render();requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></html>
